[project]
name = "splatsim"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gsplat==1.5.3",
    "torch==2.4.0+cu124",
    "torchvision==0.19.0+cu124",
    "3dgs-io",
    "pyyaml>=6.0",
    "setuptools",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "grpcio-tools>=1.60.0",
    "packaging",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15.0",
]
dds = [
    "cyclonedds>=11.0.1",
    "opencv-python-headless>=4.0.0",
]
carla = [
    "autoware-carla-scenario[carla-0-9-16]",
    "autoware-lanelet2-to-opendrive",
    "cyclonedds>=11.0.1",
    "python-dotenv>=1.0.0",
    "pyproj>=3.7.1",
]
all = [
    "splatsim[gui,carla]",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]

torchvision = [
  { index = "pytorch-cu124" },
]

3dgs-io = { git = "https://github.com/autowarefoundation/3dgs_io.git", branch = "feat/usdz-io" }

autoware-carla-scenario = { git = "https://github.com/tier4/autoware_lanelet2_to_opendrive.git", rev = "6165173a", subdirectory = "autoware_carla_scenario" }
autoware-lanelet2-to-opendrive = { git = "https://github.com/tier4/autoware_lanelet2_to_opendrive.git", rev = "6165173a", subdirectory = "autoware_lanelet2_to_opendrive" }
lanelet2-python-api-for-autoware = { git = "https://github.com/tier4/lanelet2_python_api_for_autoware", rev = "6bd27ff7ab3eed326422b960a2694dff605bdb9a" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a0",
    "mypy>=1.10.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
splatsim-viewer = "splatsim.viewer:main"
attach-scenario = "scenarios.odaibatest_attach.run:main"
splatsim-grpc-server = "splatsim.grpc_service.cli:main"
splatsim-tile-server = "splatsim.tile_server.cli:main"

[tool.ruff]
exclude = ["src/splatsim/grpc_service/_generated"]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["splatsim", "scenarios"]

# ROS 2 launch files depend on packages (launch, launch_ros, ament_index_python)
# that are not installable via pip and unavailable in the uv-managed virtualenv.
[[tool.ty.overrides]]
include = ["launch/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

# scenarios also imports ament_index_python (ROS 2 only, not pip-installable).
[[tool.ty.overrides]]
include = ["src/scenarios/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

# Generated protobuf/gRPC stubs are produced at build time and gitignored,
# so they are absent during CI type-checking.
[[tool.ty.overrides]]
include = ["src/splatsim/grpc_service/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.colcon-uv-ros]
name = "splatsim"

[tool.colcon-uv-ros.data-files]
"share/ament_index/resource_index/packages" = ["resource/splatsim"]
"share/splatsim" = ["package.xml", ".env"]
"share/splatsim/launch" = [
    "launch/splatsim_scenario.launch.xml",
    "launch/splatsim_scenario.launch.py",
    "launch/splatsim_viewer.launch.xml",
]
