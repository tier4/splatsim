syntax = "proto3";

package splatsim.v1;

// ── Shared sub-messages ──────────────────────────────────────────────

message Timestamp {
  int32 sec = 1;
  uint32 nanosec = 2;
}

message CameraIntrinsics {
  double fx = 1;
  double fy = 2;
  double cx = 3;
  double cy = 4;
  uint32 width = 5;
  uint32 height = 6;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  // wxyz convention (matching gsplat / splatsim convention).
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

message Pose {
  Vector3 position = 1;
  Quaternion rotation = 2;
}

// ── Initialization ───────────────────────────────────────────────────

message InitializeRequest {
  // Scene
  string scene_path = 1;  // path to a v2 scene USDZ (.usdz)
  bool use_sh = 2;

  // Camera
  CameraIntrinsics intrinsics = 3;
  Pose initial_pose = 4;

  // Rendering schedule
  double frame_rate = 5;          // Hz (e.g. 30.0)
  Timestamp clock_initial = 6;    // starting time for frame scheduling

  // DDS publishing
  string image_topic = 7;
  string camera_info_topic = 8;
  string frame_id = 9;

  // Renderer settings
  float near_plane = 10;
  float far_plane = 11;
  string device = 12;             // "cuda" or "cuda:0" etc.
  Vector3 background_color = 13;  // RGB [0, 1]
  string compress_format = 14;    // "jpeg", "png", or "" for raw Image

  // Level-of-Detail. Controls the initial LoD state. When left unset LoD
  // starts enabled (distance-adaptive Gaussian filtering); set false to
  // start with LoD off. The LoD index is always pre-computed at load time,
  // so LoD can be toggled at runtime afterwards via SetLod regardless of
  // this initial value.
  optional bool enable_lod = 15;
}

message InitializeResponse {
  bool success = 1;
  string message = 2;
  Vector3 scene_origin = 3;      // re-centering origin (mean of Gaussian positions)
  Vector3 ecef_translation = 4;  // scene anchor ECEF translation
  repeated double ecef_rotation = 5;  // scene anchor ECEF rotation (9 doubles, row-major 3x3)
}

// ── Camera data streaming ────────────────────────────────────────────

message CameraData {
  Timestamp stamp = 1;
  Pose pose = 2;
  // Poses for dynamic objects spawned with SpawnActor, applied to the scene
  // just before this frame is rendered. See ActorPose.
  repeated ActorPose actors = 3;
}

message StreamSummary {
  uint64 frames_rendered = 1;
  uint64 poses_received = 2;
}

// ── LiDAR data streaming ─────────────────────────────────────────────

message LidarSensorConfig {
  string name = 1;
  // Built-in elevation table selector: "OT128" | "XT32" | "HDL64E" | ""
  // (empty). A known model also supplies faithful default beam count /
  // azimuth resolution / spin rate / range for any numeric field left at 0.
  // When ``elevation_deg`` below is set it takes precedence over this.
  string sensor_type = 2;
  uint32 n_rows = 3;              // uniform-elevation beam count (fallback)
  uint32 n_columns = 4;           // azimuth samples per revolution
  double fps = 5;                 // spin rate (Hz); also the render cadence
  double min_range_m = 6;
  double max_range_m = 7;
  // Sensor mount pose in the base_link frame (sensor-in-base). The rotation
  // is a wxyz quaternion. No inversion is applied — this is the genuine
  // sensor→base extrinsic.
  Pose extrinsic = 8;
  // Explicit per-beam elevation table in degrees, any order. When non-empty
  // it overrides ``sensor_type`` and the uniform ``n_rows`` fallback.
  repeated double elevation_deg = 9;
  // DDS publishing.
  string pointcloud_topic = 10;
  string frame_id = 11;
  // Return gating. 0 selects the server defaults (drop=0.5, alpha=0.1).
  double drop_threshold = 12;
  double alpha_threshold = 13;
}

message InitializeLidarRequest {
  // The scene must already be loaded via Initialize.
  //
  // Single-sensor form. Kept for existing clients; equivalent to putting the
  // one config in `sensors` below.
  LidarSensorConfig sensor = 1;

  // Rig form: register several LiDARs at once, all sharing the loaded scene.
  // Rendering a rig through one call is what lets the server gather the
  // Gaussians ONCE per frame for the whole rig and rasterize each sensor on
  // its own CUDA stream -- N sensors then cost one multi-million-Gaussian
  // transient buffer instead of N, which is the dominant VRAM term on driving
  // scenes. Sensor names must be unique. When non-empty this takes precedence
  // over `sensor`.
  repeated LidarSensorConfig sensors = 2;
}

// ── Camera rig ───────────────────────────────────────────────────────

message CameraSensorConfig {
  string name = 1;
  CameraIntrinsics intrinsics = 2;
  // Camera→base_link extrinsic (rotation is wxyz). The server composes it
  // with the streamed base_link pose, so a rig streams ONE pose per frame.
  Pose extrinsic = 3;
  // DDS publishing.
  string image_topic = 4;
  string camera_info_topic = 5;
  string frame_id = 6;
  // "jpeg", "png", or "" for a raw Image.
  string compress_format = 7;
}

message InitializeCameraRigRequest {
  // The scene must already be loaded via Initialize. Registers cameras that
  // are driven off the shared base_link pose stream, sharing one Gaussian
  // gather per frame the same way the LiDAR rig does.
  repeated CameraSensorConfig cameras = 1;
  // Render cadence for the rig (Hz). 0 keeps the value from Initialize.
  double frame_rate = 2;
}

message RigData {
  Timestamp stamp = 1;
  // base_link → world pose. Every registered LiDAR and camera is rendered
  // from this single pose via its own extrinsic.
  Pose pose = 2;
  // Poses for dynamic objects spawned with SpawnActor, applied to the scene
  // just before this frame is rendered — so every sensor on the rig sees the
  // actors at the same instant. See ActorPose.
  repeated ActorPose actors = 3;
}

message RigSummary {
  uint64 frames_rendered = 1;
  uint64 poses_received = 2;
  uint64 lidars_rendered = 3;
  uint64 cameras_rendered = 4;
}

message LidarData {
  Timestamp stamp = 1;
  // base_link → world pose (position + wxyz quaternion). The server applies
  // the sensor→base extrinsic from InitializeLidar internally.
  Pose pose = 2;
  // Poses for dynamic objects spawned with SpawnActor, applied to the scene
  // just before this frame is rendered. See ActorPose.
  repeated ActorPose actors = 3;
}

// ── Level-of-Detail control ──────────────────────────────────────────

message SetLodRequest {
  // Turn distance-adaptive LoD Gaussian filtering on (true) or off (false).
  bool enabled = 1;
}

message SetLodResponse {
  bool success = 1;
  // Effective LoD state after the call. Note this stays false when no LoD
  // index was pre-computed for the scene (nothing to filter).
  bool enabled = 2;
  string message = 3;
}

// ── Dynamic objects (actors) ─────────────────────────────────────────

// Where an actor's poses are expressed.
//
// Background re-centres a scene on its own Gaussian centroid, so the
// renderer's frame ("tile-local") is the bundle's ENU world frame minus the
// centroid reported as InitializeResponse.scene_origin. Camera / LiDAR / rig
// poses are streamed tile-local, so actors default to the same frame; set
// world_frame on SpawnActor to hand the server raw ENU world coordinates
// instead and have it subtract the origin. The choice is fixed per instance
// at spawn time and applies to every ActorPose that follows.

message ActorAssetInfo {
  string asset_id = 1;
  string class_name = 2;
  Vector3 size = 3;      // declared box (dx, dy, dz) in metres, object frame
  uint32 n_points = 4;
  uint32 sh_degree = 5;
  bool has_lidar_attributes = 6;
}

message ListActorAssetsRequest {}

message ListActorAssetsResponse {
  bool success = 1;
  string message = 2;
  repeated ActorAssetInfo assets = 3;
}

message SpawnActorRequest {
  // Instance name, unique within the scene. This is the id ActorPose updates
  // and RemoveActor refer to.
  string instance_id = 1;
  // Asset from the loaded scene's actor bank (see ListActorAssets). Ignored
  // when asset_path is set.
  string asset_id = 2;
  // Server-side path to a standalone Gaussian object (.spz / .ply / .glb /
  // .gltf), for scenes whose bundle ships no actor bank. Takes precedence
  // over asset_id. Loaded once per path: further instances share the upload.
  string asset_path = 3;
  // Initial pose. An unset pose spawns at the origin with identity rotation;
  // an all-zero quaternion keeps the identity rotation.
  Pose pose = 4;
  // Interpret this instance's poses (this one and every streamed ActorPose)
  // as ENU world coordinates rather than tile-local ones.
  bool world_frame = 5;
}

message SpawnActorResponse {
  bool success = 1;
  string message = 2;
  uint32 n_gaussians = 3;
}

message RemoveActorRequest {
  string instance_id = 1;
}

message RemoveActorResponse {
  bool success = 1;
  string message = 2;
}

message ActorPose {
  // Instance name given to SpawnActor. An unknown id is ignored (logged once)
  // rather than failing the stream.
  string instance_id = 1;
  // Position in the frame chosen at spawn; rotation is a wxyz quaternion. An
  // all-zero quaternion keeps the actor's current rotation.
  Pose pose = 2;
}

// ── Service definition ───────────────────────────────────────────────

service RenderingService {
  // Load scene, create renderer and publishers. Blocks until ready.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);

  // Client streams timestamped camera poses. Server renders at frame_rate
  // cadence and publishes via DDS. Returns summary when stream closes.
  rpc StreamCameraData(stream CameraData) returns (StreamSummary);

  // Add a LiDAR sensor to the already-loaded scene. Call Initialize first.
  rpc InitializeLidar(InitializeLidarRequest) returns (InitializeResponse);

  // Client streams timestamped base_link poses. Server renders the LiDAR
  // panorama at the sensor's spin rate and publishes sensor_msgs/PointCloud2
  // via DDS. Returns summary when the stream closes.
  rpc StreamLidarData(stream LidarData) returns (StreamSummary);

  // Register a camera rig driven off the shared base_link pose stream.
  rpc InitializeCameraRig(InitializeCameraRigRequest) returns (InitializeResponse);

  // Client streams timestamped base_link poses; the server renders EVERY
  // registered LiDAR and camera for each pose off one shared Gaussian gather
  // (one transient buffer for the whole rig) and publishes each sensor to its
  // own DDS topic. Use this instead of separate StreamCameraData /
  // StreamLidarData streams when a rig has more than one sensor.
  rpc StreamRigData(stream RigData) returns (RigSummary);

  // Toggle Level-of-Detail filtering on the already-loaded scene at runtime.
  // Requires Initialize to have been called first.
  rpc SetLod(SetLodRequest) returns (SetLodResponse);

  // List the rigid dynamic-object assets the loaded scene bundle ships.
  rpc ListActorAssets(ListActorAssetsRequest) returns (ListActorAssetsResponse);

  // Place a dynamic object in the already-loaded scene. Its pose is then
  // driven per frame through the `actors` field of the pose streams above.
  rpc SpawnActor(SpawnActorRequest) returns (SpawnActorResponse);

  // Remove a previously spawned dynamic object from the scene.
  rpc RemoveActor(RemoveActorRequest) returns (RemoveActorResponse);
}
