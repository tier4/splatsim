defaults:
  - _self_
  - server: localhost
  - ego: default
  - entity: default
  - traffic_manager: default
  - scenario: attach_only/default
  - splatsim: default
  - map: odaibatest

server:
  host: localhost
  port: 2000
  timeout_seconds: 3600.0

traffic_manager:
  port: 8100

map:
  name: ???
  xodr_path: null
  lanelet2_path: null

ego:
  vehicle_type: vehicle.mini.cooper
  initial_speed_kmh: 0.0
